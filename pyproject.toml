[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-runtime"
version = "0.0.0"
description = "Contract-first local runtime for the Aegis CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
aeg = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
