[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jangseung"
version = "0.1.1"
description = "Contract-first local runtime for the Jangseung CLI, including the Claude Code PreToolUse governance hook"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomlkit>=0.13,<1"]
authors = [
    { name = "Seokjae Lee", email = "62044870+tjrwo736@users.noreply.github.com" },
]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/tjrwo736/jangseung"
Repository = "https://github.com/tjrwo736/jangseung"
Issues = "https://github.com/tjrwo736/jangseung/issues"

[project.scripts]
aeg = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
