[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "jangseung"
version = "0.2.1"
description = "Guard hook for Claude Code and Codex: stops secret reads, destructive commands and changes to the guard itself before a tool call runs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomlkit>=0.13,<1"]
authors = [
    { name = "Seokjae Lee", email = "62044870+tjrwo736@users.noreply.github.com" },
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]

[project.urls]
Homepage = "https://github.com/tjrwo736/jangseung"
Repository = "https://github.com/tjrwo736/jangseung"
Issues = "https://github.com/tjrwo736/jangseung/issues"

[project.scripts]
aeg = "jangseung.cli.entry:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jangseung", "jangseung.*", "src", "src.cli"]
