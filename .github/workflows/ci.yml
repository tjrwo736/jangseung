name: CI

# Independent verification for pull requests: runs the full pytest suite on the
# supported Python versions across Linux and Windows. The Windows leg matters
# because the repository has a history of platform-specific path handling and a
# handful of tests self-skip when the OS lacks symlink support.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every matrix cell independently so a single-platform failure
      # does not mask the rest.
      fail-fast: false
      matrix:
        # requires-python = ">=3.10"; cover the floor through the current stable.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git identity
        # A handful of tests create throwaway git repos. Those that commit set a
        # repo-local identity themselves, but configure a global fallback so a
        # clean runner never fails on missing user.name/user.email.
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Jangseung CI"
          git config --global init.defaultBranch main

      - name: Install package and test runner
        # Editable install puts the `src` package (and the `aeg` entry point) on
        # the path; the suite has no third-party runtime deps, only pytest.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run test suite
        run: python -m pytest -q
